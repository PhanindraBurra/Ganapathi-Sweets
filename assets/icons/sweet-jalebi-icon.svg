             C 18 34 30 22 46 22
             C 60 22 72 32 72 46
             C 72 60 62 70 50 70
             C 38 70 30 62 30 50
             C 30 40 38 32 48 32
             C 58 32 64 40 64 48
             C 64 56 56 60 50 60
             C 44 60 40 56 40 50
             C 40 46 44 42 48 44
             C 52 44 54 48 52 50" 
          fill="none" 
          stroke="url(#jalebiGlow)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Glossy Sugar Syrup Highlight -->
    <path d="M 50 18 
             C 66 16 80 29 80 48 
             C 80 58 76 66 70 72
             M 46 24
             C 58 24 68 33 68 46" 
          fill="none" 
          stroke="#FEF9C3" 
