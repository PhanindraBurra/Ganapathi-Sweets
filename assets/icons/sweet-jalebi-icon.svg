  <!-- Glistening Saffron / Sugar Drops -->
  <circle cx="52" cy="35" r="2.5" fill="#FEF08A" opacity="0.9" />
  <circle cx="68" cy="54" r="2" fill="#FEF08A" opacity="0.8" />
  <circle cx="36" cy="62" r="2.2" fill="#FEF08A" opacity="0.85" />
</svg>